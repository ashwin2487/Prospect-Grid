<template>
    <div class="slds-align_absolute-center slds-p-around_xx-small">
        <div class="slds-button_group">
            <template if:true={showSalesforceButton}>
                <lightning-button label="Create Grid for existing SF accounts" variant="brand"
                    onclick={handleshowAccountSelectionPageSF} disabled={showSFBtnDisabled}>
                </lightning-button>
            </template>

            <template if:true={showSalesNavigatorButton}>
                <lightning-button label="Find new Accounts to add to SalesForce" variant="brand"
                    onclick={handleshowAccountSelectionPageSN} class="slds-m-left_small" disabled={showSNBtnDisabled}>
                </lightning-button>
            </template>
        </div>
    </div>
    <template if:true={showAccountSelectionPageSF}>
        <div class="custom-my-grid-setup-page">
            <lightning-card>
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small slds-p-horizontal_small">
                    <h3 id="searching-with-table-label" class="slds-text-heading_medium">
                        <strong>Account Search In Salesforce</strong>
                    </h3>
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare"
                        onclick={handleCloseSFSearchPage} class="slds-m-left_x-small">
                    </lightning-button-icon>
                </div>
                <div class="slds-box slds-theme_shade slds-p-around_medium">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <h2><strong>Account Industry</strong></h2>
                            <lightning-input type="text" label="Search Industry" value={searchAccounts}
                                onchange={handleAccountsSearch} placeholder="Type account industry to search..."
                                required>
                            </lightning-input>
                            <template if:true={filteredIndustryOptions.length}>
                                <ul class="slds-box slds-m-top_small slds-list_horizontal slds-wrap slds-scrollable_y"
                                    style="max-height: 150px;">
                                    <template for:each={filteredIndustryOptions} for:item="option">
                                        <li key={option.value}
                                            class="slds-p-around_x-small slds-m-right_x-small slds-border_radius slds-border_bottom hover-option"
                                            onclick={handleIndustrySelect} data-value={option.value}
                                            data-label={option.label}>
                                            {option.label}
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:true={selectedIndustries.length}>
                                <div class="slds-m-top_small">
                                    <h3><strong>Selected Industry</strong></h3>
                                    <div class="slds-list_horizontal slds-wrap">
                                        <template for:each={selectedIndustries} for:item="industry">
                                            <span key={industry} class="slds-pill custom-pill slds-m-right_x-small">
                                                <span class="slds-pill__label custom-pill-label">{industry}</span>
                                                <lightning-button-icon icon-name="utility:close" variant="bare"
                                                    alternative-text="Remove"
                                                    class="slds-m-left_x-small custom-pill-close" data-value={industry}
                                                    onclick={handleIndustryRemove}>
                                                </lightning-button-icon>
                                            </span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <h2><strong>Account Owner</strong></h2>
                            <lightning-input type="text" label="Search Account Owner" value={searchAccountOwner}
                                onchange={handleAccountOwnerSearch} placeholder="Type account owner name to search..."
                                required>
                            </lightning-input>
                            <template if:true={filteredAccountOwnerOptions.length}>
                                <ul class="slds-box slds-m-top_small slds-list_horizontal slds-wrap slds-scrollable_y"
                                    style="max-height: 150px;">
                                    <template for:each={filteredAccountOwnerOptions} for:item="option">
                                        <li key={option.value}
                                            class="slds-p-around_x-small slds-m-right_x-small slds-border_radius slds-border_bottom hover-option"
                                            onclick={handleAccountOwnerSelect} data-value={option.value}>
                                            {option.label}
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:true={selectedAccountOwner}>
                                <div class="slds-m-top_small">
                                    <h3><strong>Selected Account Owner</strong></h3>
                                    <div class="slds-pill_container" style="background-color: transparent; border:none">
                                        <span class="slds-pill custom-pill">
                                            <span
                                                class="slds-pill__label custom-pill-label">{selectedAccountOwner.label}</span>
                                            <lightning-button-icon icon-name="utility:close" alternative-text="Remove"
                                                variant="bare" class="slds-m-left_x-small custom-pill-close"
                                                onclick={handleAccountOwnerRemove}>
                                            </lightning-button-icon>
                                        </span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="slds-box slds-theme_shade slds-p-around_medium">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-combobox name="Select Account Revenue" label="Select Account Revenue"
                                placeholder="Select revenue range" options={accountRevenue} value={selectedRevenueValue}
                                onchange={handleAccountRevenue}>
                            </lightning-combobox>
                            <template if:true={selectedRevenues.length}>
                                <div>
                                    <h3><strong>Selected Account Revenue</strong></h3>
                                    <div class="slds-pill_container" style="background-color: transparent; border:none">
                                        <template for:each={selectedRevenues} for:item="revenue">
                                            <span key={revenue.value}
                                                class="slds-pill custom-pill slds-m-right_x-small">
                                                <span class="slds-pill__label custom-pill-label">{revenue.label}</span>
                                                <lightning-button-icon icon-name="utility:close"
                                                    alternative-text="Remove" variant="bare"
                                                    class="slds-m-left_x-small custom-pill-close"
                                                    data-value={revenue.value} onclick={handleRevenueRemove}>
                                                </lightning-button-icon>
                                            </span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-combobox name="Select Account Head Count" label="Select Account Head Count"
                                placeholder="Select head count range" options={accountHeadCount}
                                value={selectedHeadCountsValue} onchange={handleAccountHeadCount}>
                            </lightning-combobox>
                            <template if:true={selectedHeadCounts.length}>
                                <div class="slds-m-top_small">
                                    <h3><strong>Selected Account Head Count</strong></h3>
                                    <div class="slds-pill_container" style="background-color: transparent; border:none">
                                        <template for:each={selectedHeadCounts} for:item="headCount">
                                            <span key={headCount.value}
                                                class="slds-pill custom-pill slds-m-right_x-small">
                                                <span
                                                    class="slds-pill__label custom-pill-label">{headCount.label}</span>
                                                <lightning-button-icon icon-name="utility:close"
                                                    alternative-text="Remove" variant="bare"
                                                    class="slds-m-left_x-small custom-pill-close"
                                                    data-value={headCount.value} onclick={handleAccountHeadCountRemove}>
                                                </lightning-button-icon>
                                            </span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="slds-grid slds-p-around_xx-small slds-align-middle">
                    <div class="slds-col slds-size_1-of-3"></div>
                    <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                        <lightning-button label="Search Accounts In Salesforce" variant="brand"
                            onclick={handleSearchAccountClick}>
                        </lightning-button>
                        <lightning-button label="Reset" variant="neutral" onclick={handleReset}
                            class="slds-m-left_small">
                        </lightning-button>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-text-align_right">
                        <lightning-button label="Back" variant="neutral" onclick={handleCloseSFSearchPage}>
                        </lightning-button>
                    </div>
                </div>
                <template if:true={errorMessage}>
                    <div class="error">{errorMessage}</div>
                </template>
            </lightning-card>
        </div>
    </template>
    <template if:true={showAccountSelectionPageSN}>
        <div class="custom-my-grid-setup-page">
            <lightning-card>
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small slds-p-horizontal_small">
                    <h3 id="searching-salesnavigator-table-label" class="slds-text-heading_medium">
                        <strong>Account Search In Sales Navigator</strong>
                    </h3>
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close"
                        onclick={handleCloseSNSearchPage} variant="bare">
                    </lightning-button-icon>
                </div>
                <div class="slds-box slds-theme_shade slds-p-around_medium">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <h2><strong>Account Industry</strong></h2>
                            <lightning-input type="text" label="Search" value={searchSNIndustryTerm}
                                onchange={handleSNIndustrySearch} placeholder="Type to search..."
                                required></lightning-input>
                            <template if:true={filteredIndustrySNOptions.length}>
                                <ul class="slds-box slds-m-top_small">
                                    <template for:each={filteredIndustrySNOptions} for:item="option">
                                        <li key={option.id}
                                            class="slds-p-around_x-small slds-border_bottom hover-option"
                                            onclick={handleSNIndustrySelect} data-value={option.id}
                                            data-label={option.title}>
                                            {option.title}
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:true={selectedIndustrySN.length}>
                                <div class="slds-m-top_small slds-text-align_left">
                                    <h3>Selected Industry</h3>
                                    <ul class="slds-list_horizontal slds-wrap">
                                        <template for:each={selectedIndustrySN} for:item="industry">
                                            <span class="custom-pill" key={industry.id}>
                                                <li class="custom-pill-label slds-grid slds-grid_vertical-align-center">
                                                    {industry.title}
                                                    <lightning-button-icon icon-name="utility:close"
                                                        alternative-text="Remove" variant="bare"
                                                        class="slds-m-left_small custom-pill-close"
                                                        data-value={industry.id} onclick={handleSNIndustryRemove}>
                                                    </lightning-button-icon>
                                                </li>
                                            </span>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <h2><strong>Account HQ Location</strong></h2>
                            <lightning-input type="text" label="Search" value={searchTerm} onchange={handleRegionSearch}
                                placeholder="Type to search..." required></lightning-input>
                            <template if:true={filteredOptions.length}>
                                <ul class="slds-box slds-m-top_small">
                                    <template for:each={filteredOptions} for:item="option">
                                        <li key={option.id}
                                            class="slds-p-around_x-small slds-border_bottom hover-option"
                                            onclick={handleRegionSelect} data-value={option.id}
                                            data-label={option.title}>
                                            {option.title}
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:true={selectedRegions.length}>
                                <div class="slds-m-top_small slds-text-align_left">
                                    <h3>Selected HQ Locations</h3>
                                    <ul class="slds-list_horizontal slds-wrap">
                                        <template for:each={selectedRegions} for:item="region">
                                            <span class="custom-pill" key={region.id}>
                                                <li class="custom-pill-label slds-grid slds-grid_vertical-align-center">
                                                    {region.title}
                                                    <lightning-button-icon icon-name="utility:close"
                                                        alternative-text="Remove" variant="bare"
                                                        class="slds-m-left_small custom-pill-close"
                                                        data-value={region.id} onclick={handleRegionRemove}>
                                                    </lightning-button-icon>
                                                </li>
                                            </span>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="slds-box slds-theme_shade slds-p-around_medium">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-combobox name="Select Account Revenue" label="Select Account Revenue"
                                placeholder="Select revenue range" options={accountRevenue} value={selectedRevenueValue}
                                onchange={handleAccountRevenue} required>
                            </lightning-combobox>
                            <template if:true={selectedRevenues.length}>
                                <div>
                                    <h3><strong>Selected Account Revenue</strong></h3>
                                    <div class="slds-pill_container" style="background-color: transparent; border:none">
                                        <template for:each={selectedRevenues} for:item="revenue">
                                            <span key={revenue.value}
                                                class="slds-pill custom-pill slds-m-right_x-small">
                                                <span class="slds-pill__label custom-pill-label">{revenue.label}</span>
                                                <lightning-button-icon icon-name="utility:close"
                                                    alternative-text="Remove" variant="bare"
                                                    class="slds-m-left_x-small custom-pill-close"
                                                    data-value={revenue.value} onclick={handleRevenueRemove}>
                                                </lightning-button-icon>
                                            </span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <lightning-combobox name="Select Account Head Count" label="Select Account Head Count"
                                placeholder="Select head count range" options={accountHeadCount}
                                value={selectedHeadCountsValue} onchange={handleAccountHeadCount} required>
                            </lightning-combobox>
                            <template if:true={selectedHeadCounts.length}>
                                <div class="slds-m-top_small">
                                    <h3><strong>Selected Account Head Count</strong></h3>
                                    <div class="slds-pill_container" style="background-color: transparent; border:none">
                                        <template for:each={selectedHeadCounts} for:item="headCount">
                                            <span key={headCount.value}
                                                class="slds-pill custom-pill slds-m-right_x-small">
                                                <span
                                                    class="slds-pill__label custom-pill-label">{headCount.label}</span>
                                                <lightning-button-icon icon-name="utility:close"
                                                    alternative-text="Remove" variant="bare"
                                                    class="slds-m-left_x-small custom-pill-close"
                                                    data-value={headCount.value} onclick={handleAccountHeadCountRemove}>
                                                </lightning-button-icon>
                                            </span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="slds-box slds-theme_shade slds-p-around_medium">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <h2><strong>Search Company</strong></h2>
                            <lightning-input type="text" label="Search" value={searchSNCompanyTerm}
                                onchange={handleSNCompanySearch} placeholder="Type to search..."></lightning-input>
                            <template if:true={filteredCompanySNOptions.length}>
                                <ul class="slds-box slds-m-top_small">
                                    <template for:each={filteredCompanySNOptions} for:item="option">
                                        <li key={option.id}
                                            class="slds-p-around_x-small slds-border_bottom hover-option"
                                            onclick={handleSNCompanySelect} data-value={option.id}
                                            data-label={option.name}>
                                            {option.name}
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:true={selectedCompanySN.length}>
                                <div class="slds-m-top_small slds-text-align_left">
                                    <h3>Selected Companies</h3>
                                    <ul class="slds-list_horizontal slds-wrap">
                                        <template for:each={selectedCompanySN} for:item="company">
                                            <span class="custom-pill" key={company.id}>
                                                <li class="custom-pill-label slds-grid slds-grid_vertical-align-center">
                                                    {company.name}
                                                    <lightning-button-icon icon-name="utility:close"
                                                        alternative-text="Remove" variant="bare"
                                                        class="slds-m-left_small custom-pill-close"
                                                        data-value={company.id} onclick={handleSNCompanyRemove}>
                                                    </lightning-button-icon>
                                                </li>
                                            </span>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="slds-grid slds-p-around_xx-small slds-align-middle">
                    <div class="slds-col slds-size_1-of-3"></div>
                    <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                        <lightning-button label="Search Accounts In Sales Navigator" variant="brand"
                            onclick={handleSearchSNAccountClick}>
                        </lightning-button>
                        <lightning-button label="Reset" variant="neutral" onclick={handleSNSearchReset}
                            class="slds-m-left_small">
                        </lightning-button>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-text-align_right">
                        <lightning-button label="Back" variant="neutral" onclick={handleCloseSNSearchPage}>
                        </lightning-button>
                    </div>
                </div>
                <template if:true={errorMessage}>
                    <div class="error">{errorMessage}</div>
                </template>
            </lightning-card>
        </div>
    </template>

    <template if:true={showLinkedInAccountsScreen}>
        <lightning-card>
            <div class="slds-text-align_center">
                <h2 id="accounts-found-on-linkedin" class="slds-text-heading_medium slds-m-bottom_xx-small">
                    Accounts Found On Sales Navigator
                </h2>
            </div>
            <div class="table-container slds-m-around_medium">
                <lightning-datatable key-field="id" data={UnipileAccountsResponse} columns={columns}
                    onrowselection={handleUnipileAcctRowSelection} selected-rows={selectedRows}>
                </lightning-datatable>

                <template if:true={isLoading}>
                    <div class="loader-overlay">
                        <lightning-spinner alternative-text="Wait... Fetching Records On Sales Navigator" size="large">
                        </lightning-spinner>
                        <p class="spinner-message">
                            This may take a little while. Thanks for your patience!
                        </p>
                    </div>
                </template>


            </div>
            <div class="slds-align_absolute-center slds-p-around_xx-small">
                <button class="slds-button slds-button_brand" onclick={handleShowCompanyDetails} disabled={isLoading}>
                    Show Account Details
                </button>
                <button class="slds-button slds-button_neutral" onclick={handleBackClickLinkedInAccountsScreen}>
                    Go Back
                </button>
            </div>
        </lightning-card>
    </template>

    <template if:true={showFoundAccountScreen}>
        <lightning-card>
            <div class="slds-text-align_center">
                <h2 id="accounts-found-with-table-label" class="slds-text-heading_medium slds-m-bottom_xx-small">
                    Accounts Found
                </h2>
            </div>

            <!-- HQ Location Filter Section -->
            <div class="slds-m-around_medium">
                <h2><strong>HQ Location for Sales Navigator Search</strong></h2>
                <div class="slds-size_1-of-2">
                    <lightning-input type="text" value={searchTerm} onchange={handleRegionSearch}
                        placeholder="Type to search..." required></lightning-input>
                </div>

                <template if:true={filteredOptions.length}>
                    <ul class="slds-box slds-m-top_small">
                        <template for:each={filteredOptions} for:item="option">
                            <li key={option.id} class="slds-p-around_x-small slds-border_bottom hover-option"
                                onclick={handleRegionSelect} data-value={option.id} data-label={option.title}>
                                {option.title}
                            </li>
                        </template>
                    </ul>
                </template>

                <template if:true={selectedRegions.length}>
                    <div class="slds-m-top_small slds-text-align_left">
                        <h3>Selected Locations</h3>
                        <ul class="slds-list_horizontal slds-wrap">
                            <template for:each={selectedRegions} for:item="region">
                                <span class="custom-pill" key={region.id}>
                                    <li class="custom-pill-label slds-grid slds-grid_vertical-align-center">
                                        {region.title}
                                        <lightning-button-icon icon-name="utility:close" alternative-text="Remove"
                                            variant="bare" class="slds-m-left_small custom-pill-close"
                                            data-value={region.id} onclick={handleRegionRemove}>
                                        </lightning-button-icon>
                                    </li>
                                </span>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>

            <!-- Data Table Section -->
            <div class="slds-m-around_medium">
                <lightning-datatable key-field="Id" data={accounts} columns={accountFoundColumn}
                    onrowselection={handleRowSelectionSearchContacts} sorted-by={sortBy}
                    sorted-direction={sortDirection} onsort={handleSortAccounts}>
                </lightning-datatable>
            </div>

            <!-- Footer Buttons -->
            <div class="slds-align_absolute-center slds-p-around_xx-small slds-text-align_center">
                <button class="slds-button slds-button_brand" onclick={handleSearchLinkedIn}>
                    Search Accounts In Sales Navigator
                </button>
                <button class="slds-button slds-button_neutral" onclick={showFoundAccountScreenClose}>
                    Back
                </button>
            </div>
        </lightning-card>
    </template>

    <template if:true={showLinkedInAccountsSNScreen}>
        <lightning-card>
            <div class="slds-text-align_center">
                <h2 id="accounts-found-on-SN" class="slds-text-heading_medium slds-m-bottom_xx-small">
                    Accounts Found On Sales Navigator
                </h2>
            </div>
            <div class="table-container slds-m-around_medium">
                <lightning-datatable key-field="id" data={SalesNavigatorAccountsResponse}
                    columns={AccountFoundOnSNcolumns} onrowselection={handleSNAcctRowSelection}
                    selected-rows={selectedRows} sorted-by={sortBy} sorted-direction={sortDirection}
                    onsort={handleSortData}>
                </lightning-datatable>

                <template if:true={isLoading}>
                    <div class="loader-overlay">
                        <lightning-spinner alternative-text="Wait... Fetching Records On Sales Navigator" size="large">
                        </lightning-spinner>
                        <p class="spinner-message">
                            This may take a little while. Thanks for your patience!
                        </p>
                    </div>
                </template>

            </div>
            <div class="slds-align_absolute-center slds-p-around_xx-small">
                <button class="slds-button slds-button_brand" onclick={handleUpdateOrCreateAccount}>
                    Update or Create Account
                </button>
                <button class="slds-button slds-button_neutral" onclick={handleBackClickLinkedInSNAccountsScreen}>
                    Go Back
                </button>
            </div>
        </lightning-card>
    </template>

    <template if:true={showCreatedAccountDetails}>
        <lightning-card>
            <div class="slds-text-align_center">
                <h2 id="accounts-details-on-linkedin" class="slds-text-heading_medium slds-m-bottom_xx-small">
                    Processed Accounts(Created)
                </h2>
            </div>
            <div class="table-container slds-m-around_medium">
                <lightning-datatable data={SNcompanyCreatedAccounts} columns={columns} key-field="id"
                    selected-rows={selectedCreatedRows} onrowselection={handleRowSelectionCreated}>
                </lightning-datatable>

                <template if:true={isLoading}>
                    <div class="loader-overlay">
                        <lightning-spinner alternative-text="Wait... Fetching Records On Sales Navigator" size="large">
                        </lightning-spinner>
                        <p class="spinner-message">
                            This may take a little while. Thanks for your patience!
                        </p>
                    </div>
                </template>
            </div>

            <!-- Processed Accounts (Updated) -->

                        </div>

                        <!-- BODY: Form -->
                        <div class="slds-modal__content slds-p-horizontal_medium slds-p-vertical_small">
                            <lightning-layout pull-to-boundary="small">
                                <lightning-layout-item padding="around-small" size="12" medium-device-size="8">
                                    <lightning-combobox name="existingGrid" label="Select Existing Grid"
                                        value={selectedGrid} placeholder="Choose Grid…" options={gridSuggestions}
                                        onchange={handleGridSelect}>
                                    </lightning-combobox>
                                </lightning-layout-item>
                            </lightning-layout>
                        </div>

                        <!-- FOOTER: Actions -->
                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutrald" label="Cancel" onclick={handleCloseAddGridTemplate}
                                class="slds-m-right_small">
                            </lightning-button>
                            <lightning-button variant="brand" label="Add To Existing Grid"
                                onclick={handleSelectedContactsAddToExistingGrid}>
                            </lightning-button>
                        </footer>
                    </div>
                </section>
            </template>


            <div class="slds-p-left_medium slds-grid slds-wrap slds-gutters">
            </div>

            <div slot="footer" class="slds-size_1-of-1 slds-m-top_large slds-grid slds-grid_align-spread">

                <div>
                    <lightning-button variant="neutral" label="Back" onclick={handleBackForContactsProccessed}>
                    </lightning-button>
                </div>

                <div class="slds-col slds-size_1-of-2">
                    <lightning-button variant="brand-outlined" label="Add to New Grid" onclick={handleAddToNewGrid}
                        class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button variant="brand-outlined" label="Add to Existing Grid"
                        onclick={handleAddToExistingGrid} class="slds-m-left_small">
                    </lightning-button>
                </div>

                <div class="slds-grid slds-gutters">
                    <lightning-button variant="brand-outlined" label="Go to Working Table"
                        onclick={handleGoToWorkingTable} class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button variant="destructive-text" label="Close" onclick={handleCloseResponseScreen}>
                    </lightning-button>
                </div>
            </div>

        </lightning-card>
    </template>

    <template if:true={showConfirmationModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container"
                style="width: fit-content; max-width: 90vw; margin: auto; position: relative;">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">LinkedIn Connect invitation</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-p-around_medium">
                        <p>
                            <strong class="slds-m-bottom_small">Grid Name: {gridName}</strong>
                        </p>
                        <template if:true={accountList.length}>
                            <strong class="slds-m-bottom_small">Accounts:</strong>
                            <ol class="slds-list_ordered">
                                <template for:each={accountList} for:item="account" for:index="index">
                                    <li class="slds-m-bottom_xx-small" key={account.id}>
                                        <span class="slds-text-body_regular">{account.name}</span>
                                    </li>
                                </template>
                            </ol>
                        </template>
                    </div>

                    <lightning-datatable key-field="id" data={contactList} columns={gridContactColumns}
                        hide-checkbox-column="true" show-row-number-column="true"
                        class="slds-m-top_medium slds-m-bottom_medium slds-table slds-table_bordered slds-table_striped"></lightning-datatable>

                    <template if:true={isMoreThan100}>
                        <p>
                            You have added <strong>{contactList.length}</strong> contacts.
                            Due to platform limits, we can only send invitations to the first <strong>100</strong>
                            contacts.
                            Do you want to proceed with sending invites to the first 100 contacts?
                        </p>
                    </template>
                    <template if:false={isMoreThan100}>
                        <p class="slds-text-align_center">
                            You have added <strong>{contactList.length}</strong> contacts.
                            Do you want to send invitations to all of them now?
                        </p>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Back" onclick={handleCancel}></lightning-button>
                    <lightning-button variant="brand" class="slds-m-left_small" label="Yes, Send Invites"
                        onclick={handleConfirm}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isProcessing}>
        <div class="slds-spinner_container slds-is-fixed">
            <div class="slds-spinner slds-spinner_large slds-spinner_brand" role="status">
                <span class="slds-assistive-text">Sending Invitations...</span>
                <div class="slds-spinner__dot-a"></div>
                <div class="slds-spinner__dot-b"></div>
            </div>
            <p class="spinner-message">
                This may take a little while. Thanks for your patience!
            </p>
        </div>
    </template>
</template>
