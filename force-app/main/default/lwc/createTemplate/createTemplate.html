<template>
    <lightning-card title="Create Template">
        <div class="slds-p-around_medium slds-grid slds-wrap slds-grid_align-center">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-text-align_center">
                <button class="slds-button slds-button_brand slds-m-around_x-small" onclick={openEmailModal}>
                    Create Email Template
                </button>
                <button class="slds-button slds-button_brand slds-m-around_x-small" onclick={openMessageModal}>
                    Create Message Template
                </button>
            </div>
        </div>
        <!-- Display Templates -->
        <div class="slds-grid slds-wrap slds-p-around_medium slds-gutters">
            <!-- Email Templates-->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <div class="slds-grid slds-grid_vertical-align-start slds-grid_align-start slds-wrap">
                    <div class="slds-col slds-size_1-of-1">
                        <h3 class="slds-text-heading_medium slds-text-title_bold slds-m-bottom_small">
                            Email Templates
                        </h3>
                    </div>

                    <div class="slds-col slds-size_1-of-1">
                        <template for:each={templates} for:item="template">
                            <div key={template.Id}
                                class="slds-box slds-box_x-small slds-m-bottom_x-small slds-theme_shade">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <p class="slds-text-body_regular">{template.Name}</p>
                                    <div>
                                        <lightning-button-icon size="small" icon-name="utility:preview"
                                            data-id={template.Id} onclick={handleViewEmailTemplate}
                                            style="margin-right: 1.5rem; cursor:pointer;">
                                        </lightning-button-icon>
                                        <lightning-button-icon size="small" icon-name="utility:edit"
                                            onclick={handleEditEmailTemplate} data-id={template.Id}
                                            data-templatename={template.Name} data-subject={template.Subject}
                                            data-body={template.Body} style="margin-right: 1.5rem; cursor:pointer;">
                                        </lightning-button-icon>
                                        <lightning-button-icon size="small" icon-name="utility:delete"
                                            onclick={handleDeleteModalOpen} data-id={template.Id}
                                            data-templatename={template.Name} data-subject={template.Subject}
                                            data-body={template.Body} style="cursor:pointer;">
                                        </lightning-button-icon>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Message Templates -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <div class="slds-grid slds-grid_vertical-align-start slds-grid_align-start slds-wrap">
                    <div class="slds-col slds-size_1-of-1">
                        <h3 class="slds-text-heading_medium slds-text-title_bold slds-m-bottom_small">
                            Message Templates
                        </h3>
                    </div>

                    <div class="slds-col slds-size_1-of-1">
                        <template for:each={messageTemplates} for:item="template">
                            <div key={template.Id}
                                class="slds-box slds-box_x-small slds-m-bottom_x-small slds-theme_shade">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <p class="slds-text-body_regular">{template.Name}</p>
                                    <div>
                                        <lightning-button-icon size="small" icon-name="utility:preview"
                                            data-id={template.Id} onclick={handleViewMessageTemplate}
                                            style="margin-right: 1.5rem; cursor:pointer;">
                                        </lightning-button-icon>
                                        <lightning-button-icon size="small" icon-name="utility:edit"
                                            onclick={handleEditMessageTemplate} data-id={template.Id}
                                            data-templatename={template.Name} data-subject={template.Subject}
                                            data-body={template.Body} style="cursor:pointer; margin-right: 1.5rem;">
                                        </lightning-button-icon>
                                        <lightning-button-icon size="small" icon-name="utility:delete"
                                            onclick={handleDeleteModalOpen} data-id={template.Id}
                                            data-templatename={template.Name} data-subject={template.Subject}
                                            data-body={template.Body} style="cursor:pointer;">
                                        </lightning-button-icon>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

        </div>
    </lightning-card>

    <!-- Modal Section -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="width: fit-content; max-width: 90vw; margin: auto;">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Create {modalType} Template</h2>
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close"
                        class="slds-modal__close slds-button_icon-inverse" onclick={handleCloseTemplateModal}>
                    </lightning-button-icon>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <label class="slds-text-heading_small">Insert Placeholder</label>
                    <div class="slds-m-top_small">
                        <template for:each={placeholderOptions} for:item="opt">
                            <lightning-button key={opt.value} label={opt.label} value={opt.value}
                                onclick={handlePlaceholderChange} class="slds-m-right_x-small">
                            </lightning-button>
                        </template>
                    </div>

                    <div class="slds-form-element slds-m-top_medium">
                        <label class="slds-form-element__label" for="templateName">Template Name</label>
                        <div class="slds-form-element__control">
                            <input id="templateName" class="slds-input" type="text" data-field="templateName"
                                value={templateName} oninput={handleNameChange} onfocus={handleCursorMove}
                                onclick={handleCursorMove} onkeyup={handleCursorMove} />
                        </div>
                    </div>

                    <lightning-input type="text" label="Developer Name" value={developerName} disabled>
                    </lightning-input>

                    <div class="slds-form-element">
                        <label class="slds-form-element__label" for="templateSubject">Subject</label>
                        <div class="slds-form-element__control">
                            <input id="templateSubject" class="slds-input" type="text" data-field="templateSubject"
                                value={templateSubject} oninput={handleSubjectChange} onfocus={handleCursorMove}
                                onclick={handleCursorMove} onkeyup={handleCursorMove} />
                        </div>
                    </div>

                    <div class="slds-form-element ">
                        <label class="slds-form-element__label" for="templateBody">Body</label>
                        <div class="slds-form-element__control">
                            <textarea id="templateBody" class="slds-textarea" data-field="templateBody"
                                oninput={handleBodyChange} onfocus={handleCursorMove} onclick={handleCursorMove}
                                onkeyup={handleCursorMove}>{templateBody}</textarea>
                        </div>
                    </div>

                    <lightning-input label="Select Folder" value={currentFolder} disabled>
                    </lightning-input>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCloseTemplateModal}
                        class="slds-m-right_medium">
                    </lightning-button>
                    <lightning-button variant="brand" label={saveButtonLabel} onclick={handleSaveTemplate}
                        disabled={isSaving}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isViewModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close"
                        class="slds-modal__close slds-button_icon-inverse" onclick={handleCloseViewModal}>
                    </lightning-button-icon>
                    <h2 class="slds-text-heading_medium">{viewTemplate.Name}</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <p><strong>Subject:</strong> {viewTemplate.Subject}</p>
                    <p class="slds-m-top_small"><strong>Body:</strong></p>
                    <div class="slds-p-top_x-small " style="white-space: pre-wrap; word-wrap: break-word;">
                        {viewTemplate.Body}
                    </div>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Close" onclick={handleCloseViewModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isEditModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container"
                style="width: fit-content; max-width: 90vw; margin: auto; position: relative;">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Update {modalType} Template</h2>
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close"
                        class="slds-modal__close slds-button_icon-inverse" onclick={handleCloseEditTemplateModal}>
                    </lightning-button-icon>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <label class="slds-text-heading_small">Insert Placeholder</label>
                    <div class="slds-m-top_small">
                        <template for:each={placeholderOptions} for:item="option">
                            <lightning-button key={option.value} label={option.label} value={option.value}
                                onclick={handlePlaceholderChange} class="slds-m-right_x-small">
                            </lightning-button>
                        </template>
                    </div>

                    <!-- Template Name -->
                    <div class="slds-form-element slds-m-top_medium">
                        <label class="slds-form-element__label" for="templateName">Template Name</label>
                        <div class="slds-form-element__control">
                            <input data-id="templateName" class="slds-input" type="text" data-field="templateName"
                                value={templateName} oninput={handleNameChange} onfocus={handleCursorMove}
                                onclick={handleCursorMove} onkeyup={handleCursorMove} />
                        </div>
                    </div>

                    <!-- Developer Name (read-only) -->
                    <div class="slds-form-element slds-m-top_medium">
                        <label class="slds-form-element__label" for="developerName">Developer Name</label>
                        <div class="slds-form-element__control">
                            <input id="developerName" class="slds-input" type="text" value={developerName} disabled />
                        </div>
                    </div>

                    <!-- Subject -->
                    <div class="slds-form-element slds-m-top_medium">
                        <label class="slds-form-element__label" for="templateSubject">Subject</label>
                        <div class="slds-form-element__control">
                            <input data-id="templateSubject" class="slds-input" type="text" data-field="templateSubject"
                                value={templateSubject} oninput={handleSubjectChange} onfocus={handleCursorMove}
                                onclick={handleCursorMove} onkeyup={handleCursorMove} />
                        </div>
                    </div>

                    <!-- Body -->
                    <div class="slds-form-element slds-m-top_medium">
                        <label class="slds-form-element__label" for="templateBody">Body</label>
                        <div class="slds-form-element__control">
                            <textarea data-id="templateBody" class="slds-textarea" data-field="templateBody"
                                oninput={handleBodyChange} onfocus={handleCursorMove}
                                onclick={handleCursorMove} onkeyup={handleCursorMove}>{templateBody}</textarea>
                        </div>
                    </div>

                    <!-- Folder (read-only) -->
                    <div class="slds-form-element slds-m-top_medium">
                        <label class="slds-form-element__label" for="currentFolder">Select Folder</label>
                        <div class="slds-form-element__control">
                            <input id="currentFolder" class="slds-input" type="text" value={currentFolder} disabled />
                        </div>
                    </div>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCloseEditTemplateModal}
                        class="slds-m-right_medium"></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={handleEditTemplate}
                        disabled={isSaving}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isDeleteModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Confirm Delete</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    Are you sure you want to delete this template?
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeDeleteModal}
                        class="slds-m-right_medium"></lightning-button>
                    <lightning-button variant="destructive" label="Delete"
                        onclick={handleDeleteTemplate}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
