<template>
    <div class="slds-card">
        <div class="slds-m-around_medium">
            <template if:true={selectedGrid}>
                <div class="slds-text-align_right">
                    <lightning-button variant="brand-outline" label='Enrich Contacts' class="slds-m-right_x-small"
                        onclick={handleEnrichContact}></lightning-button>

                    <lightning-button label="Add Contact Manually" variant="brand-outline" class="slds-m-right_x-small"
                        data-grid-id={selectedGrid} onclick={handleAddContactManually}>
                    </lightning-button>

                    <lightning-button label="Send Out linekdin Invites" variant="brand-outline"
                        onclick={opneSendAllInvitationsConfirmModal} disabled={isProcessing}
                        class="slds-m-right_x-small">
                    </lightning-button>

                    <lightning-button variant="brand-outline" label={kpisLabel} onclick={toggleKPIs}
                        class="slds-m-right_x-small"></lightning-button>
                </div>
            </template>

            <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-3 slds-m-bottom_x-small">
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-center">
                        <span class="slds-text-heading_medium slds-m-right_small"><strong>Select Grid: </strong></span>
                        <span class="slds-grow">
                        <lightning-combobox value={selectedGrid} placeholder="Select grid name..."
                            options={gridSuggestions} onchange={handleGridSelect} style="width: 13rem; margin-top: -1rem;">
                        </lightning-combobox>
                    </span>
                    </div>
                </div>

                <template if:true={selectedGrid}>
                    <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-center">
                            <span class="slds-m-right_small"><strong>Account Outreach Owner: </strong></span>
                            <template if:true={selectedGridOutreachOwnerName}>
                                <span class="slds-text-body_regular">{selectedGridOutreachOwnerName}</span>
                            </template>
                            <template if:false={selectedGridOutreachOwnerName}>
                                <span class="slds-text-body_regular">N/A</span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <template if:false={showEnrichContactsModal}>
                <lightning-spinner if:true={isLoading} alternative-text="Loading..."></lightning-spinner>
            </template>

            <template if:true={showEnrichContactsModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container"
                        style="width: fit-content; max-width: 70vw; margin: auto; position: relative;">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">Enriched Contacts</h2>
                        </header>

                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-datatable key-field="Id" data={enrichContactsData}
                                columns={enrichContactsColumns} selected-rows={selectedEnrichContactIds}
                                onrowselection={handleEnrichContactSelection}>
                            </lightning-datatable>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button variant="brand" label="Get Contact's Emails/Numbers"
                                onclick={handleGetEmailAndNumbers} disabled={disableGetContactBtn}></lightning-button>
                            <lightning-button variant="neutral" label="Close" onclick={handleCloseEnrichContactsModal}
                                class="slds-m-left_small"></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <template if:true={showOutreachReport}>
                <p class="slds-m-bottom_small slds-text-heading_small"><Strong>Outreach Summary Report</Strong></p>
                <lightning-datatable key-field="accountName" data={summaryGridData} columns={outreachReportcolumn}
                    hide-checkbox-column="true">
                </lightning-datatable>

            </template>

            <template if:true={isOpenKPIs}>
                <div class="slds-m-top_medium ">
                    <p class="slds-m-bottom_small slds-text-heading_small"><Strong>Important KPIs</Strong></p>
                    <div class="slds-grid slds-wrap slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-3">
                            <div class="slds-box slds-box_xx-small">
                                <h3 class="slds-text-title_caps slds-m-bottom_small">Input KPIs</h3>
                                <div class="slds-grid slds-wrap">
                                    <template for:each={inputKpis} for:item="kpi">
                                        <div key={kpi.label} class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                            <p class="slds-text-body_regular">{kpi.label}</p>
                                            <p class="slds-text-heading_small slds-p-top_x-small">{kpi.value}</p>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- Call KPIs -->
                        <div class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                            <div class="slds-box slds-box_xx-small">
                                <h3 class="slds-text-title_caps slds-m-bottom_small">Call KPIs</h3>
                                <p class="slds-text-body_regular">Total Call Attempts: {callKpis.attempts}</p>
                                <template for:each={callKpis.outcomes} for:item="o">
                                    <div key={o.label} class="slds-m-vertical_x-small">
                                        <p class="slds-text-body_small">{o.label}: {o.count} ({o.percentage}%)</p>
                                        <lightning-progress-bar value={o.percentage}
                                            variant="circular"></lightning-progress-bar>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Outcomes -->
                        <div class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                            <div class="slds-box slds-box_xx-small">
                                <h3 class="slds-text-title_caps slds-m-bottom_small">Outcomes</h3>
                                <div class="slds-grid slds-wrap">
                                    <template for:each={outcomeKpis} for:item="out">
                                        <div key={out.label} class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                            <p class="slds-text-body_regular">{out.label}</p>
                                            <p class="slds-text-heading_small slds-p-top_x-small">{out.count}</p>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Row 2: Response, Efficiency -->
                    <div class="slds-grid slds-wrap">

                        <!-- Response KPIs -->
                        <div class="slds-col slds-size_1-of-2">
                            <div class="slds-box slds-box_xx-small ">
                                <h3 class="slds-text-title_caps slds-m-bottom_small">Response KPIs</h3>
                                <template for:each={responseKpis} for:item="resp">
                                    <div key={resp.label} class="slds-m-bottom_small slds-p-around_x-small">
                                        <p class="slds-text-body_regular">{resp.label}: {resp.value}%</p>
                                        <lightning-progress-bar value={resp.value}
                                            variant="circular"></lightning-progress-bar>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Efficiency KPIs -->
                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                            <div class="slds-box slds-box_xx-small">
                                <h3 class="slds-text-title_caps slds-m-bottom_small">Efficiency KPIs</h3>
                                <div class="slds-grid slds-wrap">
                                    <template for:each={efficiencyKpis} for:item="eff">
                                        <div key={eff.label} class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                                            <p class="slds-text-body_regular">{eff.label}</p>
                                            <p class="slds-text-heading_small slds-p-top_x-small">{eff.value}</p>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </template>



            <!-- <template if:true={isProcessing}>
                        <div class="progress-container">
                            <lightning-progress-bar value={progress} size="large"></lightning-progress-bar>
                            <p>{progressLabel}</p>
                        </div>
                    </template>
                </div> -->

            <template if:true={filteredGridData}>
                <div class="table-container">
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                        <thead>
                            <tr>
                                <th>
                                    Outreach Owner
                                    <lightning-combobox label="Filter Outreach Owner" value={selectedOutreachOwner}
                                        placeholder="Select Outreach Owner" options={outreachOwnerOptions}
                                        onchange={handleFilterChange}>
                                    </lightning-combobox>
                                </th>
                                <th>Account Name</th>
                                <th>Contact Name</th>
                                <th>Title</th>
                                <th style="text-align: center;">Email ID</th>
                                <th>Contact Number</th>
                                <th>
                                    LinkedIn Status
                                    <lightning-combobox label="Filter LinkedIn Status" value={selectedLinkedInStatus}
                                        placeholder="Select Option" options={linkedStatusOptions}
                                        onchange={handleFilterChangeForLinkedInStatus}>
                                    </lightning-combobox>
                                </th>
                                <th>
                                    LinkedIn Message 1
                                    <lightning-combobox label="Filter LinkedIn Message 1"
                                        value={selectedLinkedInMessageStatus} placeholder="Select Option"
                                        options={linkedInMessageStatusOptions}
                                        onchange={handleFilterChangeForLinkedInMessage}>
                                    </lightning-combobox>
                                </th>
                                <th>
                                    LinkedIn Message 2
                                    <lightning-combobox label="Filter LinkedIn Message 2"
                                        value={selectedLinkedInMessageStatus2} placeholder="Select Option"
                                        options={linkedInMessageStatusOptions}
                                        onchange={handleFilterChangeForLinkedInMessage2}>
                                    </lightning-combobox>
                                </th>
                                <th>
                                    Email Message 1
                                    <lightning-combobox label="Filter Email 1" value={selectedLinkedInEmailStatus}
                                        placeholder="Select Option" options={linkedInEmailStatusOptions}
                                        onchange={handleFilterChangeForLinkedInEmail}>
                                    </lightning-combobox>
                                </th>
                                <th>
                                    Email Message 2
                                    <lightning-combobox label="Filter Email 2" value={selectedLinkedInEmailStatus2}
                                        placeholder="Select Option" options={linkedInEmailStatusOptions}
                                        onchange={handleFilterChangeForLinkedInEmail2}>
                                    </lightning-combobox>
                                </th>
                                <th>Call Attempts</th>
                                <th>Outcome</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template if:true={isGridEmpty}>
                                <template for:each={filteredGridData} for:item="record">
                                    <tr key={record.contact.Id}>
                                        <td>
                                            <template if:true={record.isEditing}>
                                                <lightning-combobox options={userOptions} value={record.newOwnerId}
                                                    placeholder="Select Owner" data-id={record.contact.Id}
                                                    data-contactname={record.contact.contactName}
                                                    onchange={handleOwnerChange}></lightning-combobox>
                                                <lightning-button-icon size="x-small" icon-name="utility:check"
                                                    alternative-text="Save" data-id={record.contact.Id}
                                                    onclick={handleSaveOwnerChange} class="slds-m-left_x-small">
                                                </lightning-button-icon>
                                                <lightning-button-icon size="x-small" icon-name="utility:close"
                                                    alternative-text="Cancel" data-id={record.contact.Id}
                                                    onclick={handleCancelEdit} class="slds-m-left_x-small">
                                                </lightning-button-icon>
                                            </template>
                                            <template if:false={record.isEditing}>
                                                <div class="slds-grid slds-grid_align-spread">
                                                    <div class="slds-size_3-of-4"
                                                        style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help;"
                                                        title={record.newOwnerName}>
                                                        {record.newOwnerName}
                                                    </div>

                                                    <div class="slds-size_1-of-4 slds-text-align_right">
                                                        <template if:true={record.newOwnerName}>
                                                            <lightning-button-icon size="x-small"
                                                                icon-name="utility:edit" alternative-text="Edit"
                                                                data-id={record.contact.Id} onclick={handleEditOwner}
                                                                class="slds-m-left_medium">
                                                            </lightning-button-icon>
                                                        </template>

                                                        <template if:false={record.newOwnerName}>
                                                            <lightning-button-icon size="x-small"
                                                                icon-name="utility:new" alternative-text="Edit"
                                                                data-id={record.contact.Id} onclick={handleEditOwner}>
                                                            </lightning-button-icon>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                        </td>
                                        <td class="accountName-col"
                                            style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help;"
                                            title={record.accountName}>
                                            {record.accountName}
                                        </td>
                                        <td class="contactName-col"
                                            style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help;"
                                            title={record.contactName}>{record.contactName}</td>
                                        <td class="contactTitle-col"
                                            style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help;"
                                            title={record.title}>{record.title}</td>

                                        <td class="email-col">
                                            <template if:true={record.isEditingEmail}>
                                                <lightning-input value={record.newEmailId} placeholder="Enter Email"
                                                    data-id={record.contact.Id} data-contactname={record.contactName}
                                                    onchange={handleEmailChange} class="email-input">
                                                </lightning-input>

                                                <lightning-button-icon size="x-small" icon-name="utility:check"
                                                    alternative-text="Save" data-id={record.contact.Id}
                                                    onclick={handleSaveEmailChange} class="slds-m-left_x-small">
                                                </lightning-button-icon>
                                                <lightning-button-icon size="x-small" icon-name="utility:close"
                                                    alternative-text="Cancel" data-id={record.contact.Id}
                                                    onclick={handleCancelEdit} class="slds-m-left_x-small">
                                                </lightning-button-icon>
                                            </template>

                                            <template if:false={record.isEditingEmail}>
                                                <div class="slds-grid slds-grid_align-spread">
                                                    <div class="slds-size_3-of-4"
                                                        style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help;"
                                                        title={record.newEmailId}>
                                                        {record.newEmailId}
                                                    </div>
                                                    <div class="slds-size_1-of-4 slds-text-align_right">
                                                        <template if:true={record.newEmailId}>
                                                            <lightning-button-icon size="x-small"
                                                                icon-name="utility:edit" alternative-text="Edit"
                                                                data-id={record.contact.Id} onclick={handleEditEmail}
                                                                class="slds-m-left_xxx-small">
                                                            </lightning-button-icon>
                                                        </template>
                                                        <template if:false={record.newEmailId}>
                                                            <lightning-button-icon size="x-small"
                                                                icon-name="utility:new" alternative-text="Edit"
                                                                data-id={record.contact.Id} onclick={handleEditEmail}>
                                                            </lightning-button-icon>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </td>


                                        <td class="phone-col">
                                            <template if:true={record.isEditingPhone}>
                                                <lightning-input value={record.newPhoneNumber}
                                                    placeholder="Enter Phone Number" data-id={record.contact.Id}
                                                    data-contactname={record.contactName} onchange={handlePhoneChange}
                                                    class="phone-input">
                                                </lightning-input>
                                                <lightning-button-icon size="x-small" icon-name="utility:check"
                                                    alternative-text="Save" data-id={record.contact.Id}
                                                    onclick={handleSavePhoneChange} class="slds-m-left_x-small">
                                                </lightning-button-icon>
                                                <lightning-button-icon size="x-small" icon-name="utility:close"
                                                    alternative-text="Cancel" data-id={record.contact.Id}
                                                    onclick={handleCancelEdit} class="slds-m-left_x-small">
                                                </lightning-button-icon>
                                            </template>

                                            <template if:false={record.isEditingPhone}>
                                                <div class="slds-grid slds-grid_align-spread">
                                                    <div class="slds-size_3-of-4"
                                                        style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help;"
                                                        title={record.newPhoneNumber}>
                                                        {record.newPhoneNumber}
                                                    </div>
                                                    <div class="slds-size_1-of-4 slds-text-align_right">
                                                        <template if:true={record.newPhoneNumber}>
                                                            <lightning-button-icon size="x-small"
                                                                icon-name="utility:edit" alternative-text="Edit"
                                                                data-id={record.contact.Id} onclick={handleEditPhone}
                                                                class="slds-m-right_medium">
                                                            </lightning-button-icon>
                                                        </template>

                                                        <template if:false={record.newPhoneNumber}>
                                                            <lightning-button-icon size="x-small"
                                                                icon-name="utility:new" alternative-text="Edit"
                                                                data-id={record.contact.Id} onclick={handleEditPhone}
                                                                class="slds-m-right_medium">
                                                            </lightning-button-icon>
                                                        </template>

                                                    </div>
                                                </div>
                                            </template>
                                        </td>

                                        <td class="small-column">
                                            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center"
                                                style="height:100%; cursor:pointer;">
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    data-id={record.contact.Id} data-contactname={record.contactName}
                                                    onclick={onClickConnectOnLinkedIn} class={record.iconClass1}>
                                                </lightning-icon>
                                            </div>
                                        </td>

                                        <td class="small-column">
                                            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center"
                                                style="height:100%; cursor:pointer;">
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    data-id={record.contact.Id} data-contactname={record.contactName}
                                                    data-contactfname={record.gridConFirstName}
                                                    data-contactlname={record.gridConLastName}
                                                    data-outreachowner={record.newOwnerId}
                                                    data-outreachownername={record.newOwnerName}
                                                    data-title={record.title} data-accountname={record.accountName}
                                                    data-messagestatus={record.linkedinMessage1Status}
                                                    onclick={onClickLinkedInMessage1}
                                                    class={record.iconClass2LinkedInMessage1}>
                                                </lightning-icon>
                                            </div>
                                        </td>

                                        <td class="small-column">
                                            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center"
                                                style="height:100%; cursor:pointer;">
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    data-id={record.contact.Id} data-contactname={record.contactName}
                                                    data-contactfname={record.gridConFirstName}
                                                    data-contactlname={record.gridConLastName}
                                                    data-outreachowner={record.newOwnerId}
                                                    data-outreachownername={record.newOwnerName}
                                                    data-title={record.title} data-accountname={record.accountName}
                                                    data-messagestatus={record.linkedinMessage2Status}
                                                    onclick={onClickLinkedInMessage2}
                                                    class={record.iconClass2LinkedInMessage2}>
                                                </lightning-icon>
                                            </div>
                                        </td>
                                        <td class="small-column">
                                            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center"
                                                style="height:100%; cursor:pointer;">
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    data-id={record.contact.Id} data-contactname={record.contactName}
                                                    data-contactfname={record.gridConFirstName}
                                                    data-contactlname={record.gridConLastName}
                                                    data-outreachowner={record.newOwnerId}
                                                    data-outreachownername={record.newOwnerName}
                                                    data-title={record.title} data-accountname={record.accountName}
                                                    data-email={record.newEmailId} onclick={onClickEmailmessage1}
                                                    class={record.iconClassEmail1}>
                                                </lightning-icon>
                                            </div>
                                        </td>
                                        <td class="small-column">
                                            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center"
                                                style="height:100%; cursor:pointer;">
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    data-id={record.contact.Id} data-contactname={record.contactName}
                                                    data-contactfname={record.gridConFirstName}
                                                    data-contactlname={record.gridConLastName}
                                                    data-outreachowner={record.newOwnerId}
                                                    data-outreachownername={record.newOwnerName}
                                                    data-title={record.title} data-accountname={record.accountName}
                                                    data-email={record.newEmailId} onclick={onClickEmailmessage2}
                                                    class={record.iconClassEmail2}>
                                                </lightning-icon>
                                            </div>
                                        </td>
                                        <td class="small-column">
                                            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center"
                                                style="height:100%;">
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    data-id={record.contact.Id} data-attempt="1"
                                                    onclick={onClickCallAttempts} class={record.callAttemptIcon1}>
                                                </lightning-icon>
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    data-id={record.contact.Id} data-attempt="2"
                                                    onclick={onClickCallAttempts} class={record.callAttemptIcon2}>
                                                </lightning-icon>
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    data-id={record.contact.Id} data-attempt="3"
                                                    onclick={onClickCallAttempts} class={record.callAttemptIcon3}>
                                                </lightning-icon>
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    data-id={record.contact.Id} data-attempt="4"
                                                    onclick={onClickCallAttempts} class={record.callAttemptIcon4}>
                                                </lightning-icon>
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    data-id={record.contact.Id} data-attempt="5"
                                                    onclick={onClickCallAttempts} class={record.callAttemptIcon5}>
                                                </lightning-icon>
                                            </div>
                                        </td>
                                        <td>
                                            <lightning-combobox value={record.conOutcome} options={outcomeOptions}
                                                onchange={handleOutcomeChange} data-id={record.contact.Id}>
                                            </lightning-combobox>
                                        </td>
                                        <td class="notes-column">
                                            <div class="slds-grid slds-grid_align-spread slds-p-horizontal_small">
                                                <div class="notes-text slds-truncate slds-m-right_small"
                                                    title={record.description}>
                                                    {record.description}
                                                </div>

                                                <lightning-button-icon icon-name="utility:edit"
                                                    onclick={handleOpenNotesPopup} data-id={record.contact.Id}
                                                    alternative-text="Edit Notes" size="small">
                                                </lightning-button-icon>

                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </template>

                            <template if:false={isGridEmpty}>
                                <tr>
                                    <td colspan="15" style="height: 200px; padding: 0;">
                                        <div class="slds-text-align_center slds-p-around_xx-large slds-text-heading_medium slds-theme_alert-texture"
                                            style="height: 100%;">
                                            <div class="slds-text-heading_medium">No data available</div>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <template if:true={showConfirmationModalForSendAllInvitation}>
                <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container slds-modal_x-large">

                        <header class="slds-modal__header">
                            <h2 class="slds-modal__title slds-hyphenate">Confirm Action</h2>
